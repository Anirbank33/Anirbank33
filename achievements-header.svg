<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 46" width="100%" height="46" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="achHdrBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="achHdrBorderDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="achHdrSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="achGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="achLaserSweep" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;200%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;300%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Base Panel -->
  <rect x="2" y="2" width="876" height="42" rx="10" fill="url(#achHdrBgDark)" stroke="url(#achHdrBorderDark)" stroke-width="1.2"/>
  <rect x="2" y="2" width="876" height="42" rx="10" fill="url(#achHdrSheen)"/>
  <line x1="12" y1="2" x2="868" y2="2" stroke="url(#achLaserSweep)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Left Icon: 3D Trophy Star -->
  <g transform="translate(18, 11)">
    <circle cx="12" cy="12" r="11" fill="#451a03" stroke="#fbbf24" stroke-width="1"/>
    <path d="M12,5 L14,9.5 L19,10 L15.5,13.5 L16.5,18 L12,15.5 L7.5,18 L8.5,13.5 L5,10 L10,9.5 Z" fill="#fbbf24" filter="url(#achGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Title & Subtitle -->
  <text x="48" y="22" fill="#ffffff" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="12.5" font-weight="800" letter-spacing="1">
    GITHUB ACHIEVEMENTS &amp; HONORS
  </text>
  <text x="48" y="34" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="500">
    Unlocked Trophies · Open-Source Pull Request Mastery · Community &amp; Engineering Milestones
  </text>

  <!-- Right Badge -->
  <g transform="translate(730, 11)">
    <rect x="0" y="0" width="134" height="24" rx="12" fill="#1e1b4b" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#fbbf24" filter="url(#achGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="15.5" fill="#fef3c7" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="0.5">
      4 TROPHIES ACTIVE
    </text>
  </g>
</svg>
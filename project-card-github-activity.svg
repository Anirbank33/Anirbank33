<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="actGlassDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.88"/>
    </linearGradient>

    <linearGradient id="actBorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="actSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="actShimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;220%" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;320%" dur="7.5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="actOrbBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="actNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="barGrad5" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="barGrad6" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <circle cx="140" cy="80" r="70" fill="#00f0ff" opacity="0.22" filter="url(#actOrbBlur)">
    <animate attributeName="cx" values="140;180;140" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.18;0.32;0.18" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="130" r="80" fill="#a855f7" opacity="0.18" filter="url(#actOrbBlur)">
    <animate attributeName="cy" values="130;100;130" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="80" r="75" fill="#0284c7" opacity="0.25" filter="url(#actOrbBlur)">
    <animate attributeName="cx" values="760;720;760" dur="7s" repeatCount="indefinite"/>
  </circle>

  <rect x="2" y="2" width="876" height="196" rx="16" fill="url(#actGlassDark)" stroke="url(#actBorderDark)" stroke-width="1.5"/>
  <rect x="2" y="2" width="876" height="196" rx="16" fill="url(#actSheen)"/>
  <rect x="2" y="2" width="876" height="196" rx="16" fill="url(#actShimmer)"/>
  <line x1="18" y1="2" x2="862" y2="2" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" opacity="0.95" filter="url(#actNeonGlow)"/>

  <!-- LEFT COLUMN: DETAILS -->
  <g transform="translate(28, 22)">
    <rect x="0" y="0" width="220" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#00f0ff" filter="url(#actNeonGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="16" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="0.6">
      ANALYTICS &amp; VELOCITY ENGINE
    </text>
  </g>

  <text x="28" y="74" fill="#ffffff" font-family="'JetBrains Mono', 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="800" letter-spacing="0.4">
    github-activity-2021-2026
  </text>

  <text x="28" y="98" fill="#cbd5e1" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="13" font-weight="400">
    Multi-year contribution analytics platform with dark/light dynamic auto-theming.
  </text>
  <text x="28" y="117" fill="#94a3b8" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400">
    Visualizes commit surges, daily activity velocity cadence, and productivity benchmarks.
  </text>

  <g transform="translate(28, 134)">
    <rect x="0" y="0" width="62" height="22" rx="5" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="31" y="15" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">HTML5</text>

    <rect x="70" y="0" width="56" height="22" rx="5" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="98" y="15" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">CSS3</text>

    <rect x="134" y="0" width="86" height="22" rx="5" fill="#1e293b" fill-opacity="0.75" stroke="#facc15" stroke-opacity="0.4" stroke-width="1"/>
    <text x="177" y="15" text-anchor="middle" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">JavaScript</text>

    <rect x="228" y="0" width="86" height="22" rx="5" fill="#1e293b" fill-opacity="0.75" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1"/>
    <text x="271" y="15" text-anchor="middle" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SVG Engine</text>

    <rect x="322" y="0" width="88" height="22" rx="5" fill="#1e293b" fill-opacity="0.75" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
    <text x="366" y="15" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">GitHub API</text>
  </g>

  <g transform="translate(28, 166)">
    <rect x="0" y="0" width="168" height="24" rx="12" fill="#00f0ff" fill-opacity="0.16" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="16" y="16" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="0.4">
      ⚡ OPEN LIVE APP ↗
    </text>
  </g>
  <g transform="translate(206, 166)">
    <rect x="0" y="0" width="138" height="24" rx="12" fill="#a855f7" fill-opacity="0.15" stroke="#c084fc" stroke-width="1.2"/>
    <text x="14" y="16" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="0.4">
      📦 REPO SOURCE ↗
    </text>
  </g>

  <!-- RIGHT COLUMN: INTERACTIVE HUD -->
  <g transform="translate(540, 20)">
    <rect x="0" y="0" width="316" height="160" rx="12" fill="#090d16" fill-opacity="0.75" stroke="#334155" stroke-opacity="0.6" stroke-width="1.2"/>

    <line x1="0" y1="28" x2="316" y2="28" stroke="#1e293b" stroke-width="1"/>
    <circle cx="16" cy="14" r="3.5" fill="#10b981" filter="url(#actNeonGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">
      CONTRIBUTION SURGE (2021-2026)
    </text>
    <text x="250" y="18" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">
      +340% ↑
    </text>

    <line x1="16" y1="55" x2="300" y2="55" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="16" y1="85" x2="300" y2="85" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="16" y1="115" x2="300" y2="115" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- Bar 1: 2021 -->
    <g transform="translate(30, 0)">
      <rect x="0" y="85" width="28" height="45" rx="4" fill="url(#barGrad1)">
        <animate attributeName="height" values="35;48;35" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="95;82;95" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="14" y="144" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">'21</text>
    </g>

    <!-- Bar 2: 2022 -->
    <g transform="translate(75, 0)">
      <rect x="0" y="70" width="28" height="60" rx="4" fill="url(#barGrad2)">
        <animate attributeName="height" values="50;65;50" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="80;65;80" dur="3.4s" repeatCount="indefinite"/>
      </rect>
      <text x="14" y="144" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">'22</text>
    </g>

    <!-- Bar 3: 2023 -->
    <g transform="translate(120, 0)">
      <rect x="0" y="60" width="28" height="70" rx="4" fill="url(#barGrad3)">
        <animate attributeName="height" values="60;75;60" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="70;55;70" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <text x="14" y="144" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">'23</text>
    </g>

    <!-- Bar 4: 2024 -->
    <g transform="translate(165, 0)">
      <rect x="0" y="50" width="28" height="80" rx="4" fill="url(#barGrad4)">
        <animate attributeName="height" values="72;85;72" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="58;45;58" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <text x="14" y="144" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">'24</text>
    </g>

    <!-- Bar 5: 2025 -->
    <g transform="translate(210, 0)">
      <rect x="0" y="42" width="28" height="88" rx="4" fill="url(#barGrad5)">
        <animate attributeName="height" values="80;95;80" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="50;35;50" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <text x="14" y="144" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">'25</text>
    </g>

    <!-- Bar 6: 2026 Surge -->
    <g transform="translate(255, 0)">
      <rect x="0" y="32" width="30" height="98" rx="4" fill="url(#barGrad6)" filter="url(#actNeonGlow)">
        <animate attributeName="height" values="90;105;90" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="40;25;40" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="15" y="144" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">'26</text>
    </g>

    <polyline points="44,98 89,82 134,70 179,55 224,45 270,32" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.85"/>
    <circle cx="270" cy="32" r="3.5" fill="#ffffff" filter="url(#actNeonGlow)">
      <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
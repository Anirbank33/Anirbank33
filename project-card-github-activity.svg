<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 280" width="100%" height="280" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="actCmpBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Liquid Glass Refractive Edge Bevel -->
    <linearGradient id="actCmpBorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#e0f2fe" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="actCmpSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Liquid Specular Light Shimmer -->
    <linearGradient id="actCmpShimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;220%" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;320%" dur="7.5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="actCmpOrb" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="actCmpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Liquid Glass Surge Bar Gradients -->
    <linearGradient id="bC1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.65"/><stop offset="70%" stop-color="#38bdf8" stop-opacity="0.9"/><stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bC2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.65"/><stop offset="70%" stop-color="#38bdf8" stop-opacity="0.9"/><stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="bC3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7"/><stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.95"/><stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="bC4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.7"/><stop offset="70%" stop-color="#38bdf8" stop-opacity="0.95"/><stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="bC5" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.75"/><stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.95"/><stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="bC6" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/><stop offset="60%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Ambient Liquid Glass Caustics -->
  <circle cx="45" cy="50" r="40" fill="#ffffff" opacity="0.18" filter="url(#actCmpOrb)">
    <animate attributeName="cx" values="45;70;45" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="190" r="45" fill="#e0f2fe" opacity="0.16" filter="url(#actCmpOrb)">
    <animate attributeName="cy" values="190;160;190" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer Glass Panel -->
  <rect x="2" y="2" width="166" height="276" rx="14" fill="url(#actCmpBgDark)" stroke="url(#actCmpBorderDark)" stroke-width="1.4"/>
  <rect x="2" y="2" width="166" height="276" rx="14" fill="url(#actCmpSheen)"/>
  <rect x="2" y="2" width="166" height="276" rx="14" fill="url(#actCmpShimmer)"/>
  <line x1="14" y1="2" x2="156" y2="2" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" filter="url(#actCmpGlow)"/>

  <!-- Category Tag -->
  <g transform="translate(10, 14)">
    <rect x="0" y="0" width="150" height="18" rx="5" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
    <circle cx="9" cy="9" r="3" fill="#38bdf8" filter="url(#actCmpGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="12.5" fill="#e0f2fe" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="0.5">
      ANALYTICS ENGINE
    </text>
  </g>

  <!-- Title -->
  <text x="10" y="48" fill="#ffffff" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.2">
    github-activity
  </text>
  <text x="10" y="62" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">
    2021–2026 Telemetry
  </text>

  <!-- Tagline -->
  <text x="10" y="78" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="500">
    Contribution velocity dashboard
  </text>

  <!-- ANIMATED SURGE BAR CHART HUD -->
  <g transform="translate(10, 88)">
    <rect x="0" y="0" width="150" height="78" rx="8" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
    
    <line x1="0" y1="18" x2="150" y2="18" stroke="#1e293b" stroke-width="0.8"/>
    <circle cx="9" cy="9" r="2.5" fill="#38bdf8" filter="url(#actCmpGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="16" y="12" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">
      VELOCITY SURGE
    </text>
    <text x="142" y="12" text-anchor="end" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">
      +340% ↑
    </text>

    <!-- Grid lines -->
    <line x1="8" y1="36" x2="142" y2="36" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="8" y1="52" x2="142" y2="52" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2,2"/>

    <!-- 6 Animated Liquid Glass Bars -->
    <rect x="10" y="44" width="14" height="22" rx="2" fill="url(#bC1)">
      <animate attributeName="height" values="18;24;18" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="48;42;48" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="17" y="73" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600">'21</text>

    <rect x="32" y="38" width="14" height="28" rx="2" fill="url(#bC2)">
      <animate attributeName="height" values="24;32;24" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="42;34;42" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="39" y="73" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600">'22</text>

    <rect x="54" y="32" width="14" height="34" rx="2" fill="url(#bC3)">
      <animate attributeName="height" values="30;38;30" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="36;28;36" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <text x="61" y="73" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600">'23</text>

    <rect x="76" y="27" width="14" height="39" rx="2" fill="url(#bC4)">
      <animate attributeName="height" values="36;44;36" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;22;30" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="83" y="73" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600">'24</text>

    <rect x="98" y="24" width="14" height="42" rx="2" fill="url(#bC5)">
      <animate attributeName="height" values="40;48;40" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="26;18;26" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="105" y="73" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600">'25</text>

    <rect x="120" y="20" width="16" height="46" rx="2" fill="url(#bC6)" filter="url(#actCmpGlow)">
      <animate attributeName="height" values="44;52;44" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="22;14;22" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="128" y="73" text-anchor="middle" fill="#bae6fd" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800">'26</text>

    <!-- Sparkline -->
    <polyline points="17,50 39,44 61,38 83,30 105,25 128,20" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>
    <circle cx="128" cy="20" r="2.5" fill="#ffffff" filter="url(#actCmpGlow)">
      <animate attributeName="r" values="2;3.5;2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- TECH BADGES (Frosted Glass) -->
  <g transform="translate(10, 178)">
    <rect x="0" y="0" width="46" height="18" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8"/>
    <text x="23" y="12.5" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">HTML5</text>

    <rect x="52" y="0" width="42" height="18" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8"/>
    <text x="73" y="12.5" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">CSS3</text>

    <rect x="100" y="0" width="50" height="18" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8"/>
    <text x="125" y="12.5" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">JS ES6</text>

    <rect x="0" y="24" width="70" height="18" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8"/>
    <text x="35" y="36.5" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">SVG Engine</text>

    <rect x="76" y="24" width="74" height="18" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8"/>
    <text x="113" y="36.5" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">GitHub API</text>
  </g>

  <!-- Bottom CTA Pill -->
  <g transform="translate(10, 248)">
    <rect x="0" y="0" width="150" height="22" rx="11" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.1"/>
    <text x="75" y="15" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.4">
      ⚡ OPEN DASHBOARD ↗
    </text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      @keyframes pulse-ring {
        0% { r: 15; opacity: 0.4; }
        100% { r: 35; opacity: 0; }
      }
      @keyframes data-pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    </style>
  </defs>
  
  <!-- Database cylinder - bottom ellipse -->
  <ellipse cx="60" cy="95" rx="35" ry="10" fill="none" stroke="#2F81F7" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Database cylinder - top ellipse -->
  <ellipse cx="60" cy="30" rx="35" ry="10" fill="#1e1e2e" stroke="#2F81F7" stroke-width="1.5"/>
  
  <!-- Database cylinder - sides -->
  <path d="M25 30 L25 95" fill="none" stroke="#2F81F7" stroke-width="1.5" opacity="0.5"/>
  <path d="M95 30 L95 95" fill="none" stroke="#2F81F7" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Inner top ellipse (data surface) -->
  <ellipse cx="60" cy="32" rx="30" ry="8" fill="#2a2a3e" opacity="0.6"/>
  
  <!-- Data rings pulsing from center -->
  <g stroke="#2F81F7" stroke-width="1.5" fill="none" opacity="0">
    <ellipse cx="60" cy="62" rx="5" ry="3">
      <animate attributeName="rx" values="5;25" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="3;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="60" cy="62" rx="5" ry="3">
      <animate attributeName="rx" values="5;25" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="ry" values="3;12" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="0.5;0" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </ellipse>
    <ellipse cx="60" cy="62" rx="5" ry="3">
      <animate attributeName="rx" values="5;25" dur="2s" repeatCount="indefinite" begin="1.4s"/>
      <animate attributeName="ry" values="3;12" dur="2s" repeatCount="indefinite" begin="1.4s"/>
      <animate attributeName="opacity" values="0.5;0" dur="2s" repeatCount="indefinite" begin="1.4s"/>
    </ellipse>
  </g>
  
  <!-- Data blocks inside cylinder -->
  <g fill="#2F81F7" opacity="0.4">
    <rect x="35" y="40" width="50" height="8" rx="2">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.8s" repeatCount="indefinite" begin="0s"/>
    </rect>
    <rect x="38" y="55" width="44" height="8" rx="2">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
    </rect>
    <rect x="35" y="70" width="50" height="8" rx="2">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.8s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
    <rect x="38" y="85" width="44" height="8" rx="2">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.8s" repeatCount="indefinite" begin="0.9s"/>
    </rect>
  </g>
  
  <!-- Connection lines from sides -->
  <g stroke="#2F81F7" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0.5">
    <path d="M15 62 Q30 62 30 62">
      <animate attributeName="stroke-dashoffset" values="10;0;-10" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M90 62 Q105 62 105 62">
      <animate attributeName="stroke-dashoffset" values="10;0;-10" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </path>
  </g>
  
  <!-- DB text -->
  <text x="60" y="115" font-family="monospace" font-size="10" font-weight="bold" fill="#2F81F7" text-anchor="middle" opacity="0.7">DB</text>
</svg>
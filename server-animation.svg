<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="rackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a3e"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="slotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3a4e"/>
      <stop offset="50%" stop-color="#2a2a3e"/>
      <stop offset="100%" stop-color="#3a3a4e"/>
    </linearGradient>
    <linearGradient id="ledGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4db8ff"/>
      <stop offset="100%" stop-color="#2F81F7"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F81F7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4db8ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2F81F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="1" dy="1"/>
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="arithmetic" k2="-1" k3="1"/>
    </filter>
  </defs>
  
  <!-- Shadow under rack -->
  <ellipse cx="60" cy="108" rx="40" ry="6" fill="#000" opacity="0.25" filter="url(#shadow)"/>
  
  <!-- Server rack body with 3D gradient -->
  <rect x="25" y="20" width="70" height="80" rx="6" fill="url(#rackGrad)" stroke="#2F81F7" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Rack front edge highlight (3D) -->
  <path d="M25 20 L25 100" fill="none" stroke="#3a7bd5" stroke-width="1" opacity="0.4"/>
  <path d="M95 20 L95 100" fill="none" stroke="#1a1a2a" stroke-width="1" opacity="0.5"/>
  
  <!-- Server slots with 3D gradient -->
  <g fill="url(#slotGrad)">
    <rect x="30" y="28" width="60" height="14" rx="3">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="fill-opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite" begin="0s"/>
    </rect>
    <rect x="30" y="48" width="60" height="14" rx="3">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite" begin="0.4s"/>
    </rect>
    <rect x="30" y="68" width="60" height="14" rx="3">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite" begin="0.8s"/>
    </rect>
    <rect x="30" y="88" width="60" height="14" rx="3">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite" begin="1.2s"/>
    </rect>
  </g>
  
  <!-- Slot inner depth lines -->
  <g stroke="#1a1a2a" stroke-width="0.5" opacity="0.4">
    <line x1="32" y1="30" x2="88" y2="30"/>
    <line x1="32" y1="50" x2="88" y2="50"/>
    <line x1="32" y1="70" x2="88" y2="70"/>
    <line x1="32" y1="90" x2="88" y2="90"/>
  </g>
  
  <!-- LED lights with 3D glow -->
  <g filter="url(#glow)">
    <circle cx="40" cy="35" r="4" fill="url(#ledGrad)">
      <animate attributeName="r" values="4;5;4" dur="1.5s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="80" cy="35" r="4" fill="url(#ledGrad)">
      <animate attributeName="r" values="4;5;4" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="40" cy="55" r="4" fill="url(#ledGrad)">
      <animate attributeName="r" values="4;5;4" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="80" cy="55" r="4" fill="url(#ledGrad)">
      <animate attributeName="r" values="4;5;4" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <circle cx="40" cy="75" r="4" fill="url(#ledGrad)">
      <animate attributeName="r" values="4;5;4" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="80" cy="75" r="4" fill="url(#ledGrad)">
      <animate attributeName="r" values="4;5;4" dur="1.5s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="40" cy="95" r="4" fill="url(#ledGrad)">
      <animate attributeName="r" values="4;5;4" dur="1.5s" repeatCount="indefinite" begin="1.8s"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    <circle cx="80" cy="95" r="4" fill="url(#ledGrad)">
      <animate attributeName="r" values="4;5;4" dur="1.5s" repeatCount="indefinite" begin="2.1s"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
  </g>
  
  <!-- LED inner highlights -->
  <g fill="#fff" opacity="0.3">
    <circle cx="39" cy="34" r="1.5">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="79" cy="34" r="1.5">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="39" cy="54" r="1.5">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="79" cy="54" r="1.5">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <circle cx="39" cy="74" r="1.5">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="79" cy="74" r="1.5">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="1.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="39" cy="94" r="1.5">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="1.5s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    <circle cx="79" cy="94" r="1.5">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="1.5s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
  </g>
  
  <!-- Data flow lines with gradient -->
  <g stroke="url(#dataGrad)" stroke-width="2" fill="none" stroke-dasharray="10 8" stroke-linecap="round" filter="url(#glow)">
    <path d="M15 40 Q30 40 30 40">
      <animate attributeName="stroke-dashoffset" values="20;0;-20" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M95 40 Q105 40 105 40">
      <animate attributeName="stroke-dashoffset" values="20;0;-20" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
    </path>
    <path d="M15 60 Q30 60 30 60">
      <animate attributeName="stroke-dashoffset" values="20;0;-20" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
    </path>
    <path d="M95 60 Q105 60 105 60">
      <animate attributeName="stroke-dashoffset" values="20;0;-20" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
    </path>
    <path d="M15 80 Q30 80 30 80">
      <animate attributeName="stroke-dashoffset" values="20;0;-20" dur="1.5s" repeatCount="indefinite" begin="1.6s"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="1.6s"/>
    </path>
    <path d="M95 80 Q105 80 105 80">
      <animate attributeName="stroke-dashoffset" values="20;0;-20" dur="1.5s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="2s"/>
    </path>
  </g>
  
  <!-- Floating data packets -->
  <g fill="#4db8ff" filter="url(#glow)">
    <circle cx="20" cy="40" r="3">
      <animate attributeName="cx" values="20;28;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="60" r="3">
      <animate attributeName="cx" values="100;92;100" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="r" values="3;2;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="20" cy="80" r="3">
      <animate attributeName="cx" values="20;28;20" dur="2s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="r" values="3;2;1" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="100" cy="95" r="3">
      <animate attributeName="cx" values="100;92;100" dur="2s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="r" values="3;2;1" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>
  
  <!-- API text with 3D effect -->
  <text x="60" y="115" font-family="monospace" font-size="11" font-weight="bold" fill="#2F81F7" text-anchor="middle" opacity="0.8" filter="url(#glow)">API</text>
  <text x="60" y="115" font-family="monospace" font-size="11" font-weight="bold" fill="#0f0f1a" text-anchor="middle" opacity="0.3" dx="1" dy="1">API</text>
</svg>
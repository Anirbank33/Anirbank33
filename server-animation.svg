<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="rackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="50%" stop-color="#1a1a2a"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="slotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2a3e"/>
      <stop offset="50%" stop-color="#3a3a4e"/>
      <stop offset="100%" stop-color="#2a2a3e"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a651" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d46a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00a651" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a651"/>
      <stop offset="100%" stop-color="#007540"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Shadow under rack -->
  <ellipse cx="60" cy="130" rx="40" ry="6" fill="#000" opacity="0.25" filter="url(#shadow)"/>
  
  <!-- Server rack body -->
  <rect x="20" y="15" width="80" height="100" rx="8" fill="url(#rackGrad)" stroke="#00a651" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Front edge highlights -->
  <path d="M20 15 L20 115" fill="none" stroke="#00a651" stroke-width="1" opacity="0.3"/>
  <path d="M100 15 L100 115" fill="none" stroke="#0f0f1a" stroke-width="1" opacity="0.5"/>
  
  <!-- Data input port (left) - receiving from CLIENT -->
  <g filter="url(#glow)">
    <circle cx="15" cy="55" r="6" fill="#00a651" opacity="0.3"/>
    <circle cx="15" cy="55" r="4" fill="#00d46a" opacity="0.6">
      <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Incoming data packets -->
    <g fill="#00d46a">
      <circle cx="8" cy="55" r="3">
        <animate attributeName="cx" values="8;-7;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="8" cy="50" r="2.5">
        <animate attributeName="cx" values="8;-7;8" dur="2s" repeatCount="indefinite" begin="0.7s"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite" begin="0.7s"/>
        <animate attributeName="r" values="2.5;1.5;1" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      </circle>
      <circle cx="8" cy="60" r="2.5">
        <animate attributeName="cx" values="8;-7;8" dur="2s" repeatCount="indefinite" begin="1.3s"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite" begin="1.3s"/>
        <animate attributeName="r" values="2.5;1.5;1" dur="2s" repeatCount="indefinite" begin="1.3s"/>
      </circle>
    </g>
    <text x="-2" y="52" font-family="monospace" font-size="7" fill="#00a651" text-anchor="end" opacity="0.7">CLIENT →</text>
  </g>
  
  <!-- Server slots with processing indicator -->
  <g fill="url(#slotGrad)">
    <rect x="28" y="25" width="64" height="16" rx="4">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="46" width="64" height="16" rx="4">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </rect>
    <rect x="28" y="67" width="64" height="16" rx="4">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
    <rect x="28" y="88" width="64" height="16" rx="4">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite" begin="0.9s"/>
    </rect>
  </g>
  
  <!-- Slot processing LEDs -->
  <g filter="url(#glow)">
    <circle cx="50" cy="33" r="4" fill="url(#apiGrad)">
      <animate attributeName="r" values="4;5;4" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="33" r="4" fill="url(#apiGrad)">
      <animate attributeName="r" values="4;5;4" dur="1s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="50" cy="54" r="4" fill="url(#apiGrad)">
      <animate attributeName="r" values="4;5;4" dur="1s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="70" cy="54" r="4" fill="url(#apiGrad)">
      <animate attributeName="r" values="4;5;4" dur="1s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="50" cy="75" r="4" fill="url(#apiGrad)">
      <animate attributeName="r" values="4;5;4" dur="1s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="70" cy="75" r="4" fill="url(#apiGrad)">
      <animate attributeName="r" values="4;5;4" dur="1s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="50" cy="96" r="4" fill="url(#apiGrad)">
      <animate attributeName="r" values="4;5;4" dur="1s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="70" cy="96" r="4" fill="url(#apiGrad)">
      <animate attributeName="r" values="4;5;4" dur="1s" repeatCount="indefinite" begin="1.4s"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" begin="1.4s"/>
    </circle>
  </g>
  
  <!-- Data flow lines processing internally -->
  <g stroke="url(#dataGrad)" stroke-width="2" fill="none" stroke-dasharray="8 6" stroke-linecap="round" filter="url(#glow)">
    <path d="M40 42 Q50 42 50 42">
      <animate attributeName="stroke-dashoffset" values="16;0;-16" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M80 42 Q90 42 90 42">
      <animate attributeName="stroke-dashoffset" values="16;0;-16" dur="1s" repeatCount="indefinite" begin="0.2s"/>
    </path>
    <path d="M40 63 Q50 63 50 63">
      <animate attributeName="stroke-dashoffset" values="16;0;-16" dur="1s" repeatCount="indefinite" begin="0.4s"/>
    </path>
    <path d="M80 63 Q90 63 90 63">
      <animate attributeName="stroke-dashoffset" values="16;0;-16" dur="1s" repeatCount="indefinite" begin="0.6s"/>
    </path>
    <path d="M40 84 Q50 84 50 84">
      <animate attributeName="stroke-dashoffset" values="16;0;-16" dur="1s" repeatCount="indefinite" begin="0.8s"/>
    </path>
    <path d="M80 84 Q90 84 90 84">
      <animate attributeName="stroke-dashoffset" values="16;0;-16" dur="1s" repeatCount="indefinite" begin="1s"/>
    </path>
  </g>
  
  <!-- Data output port (right) - sending to DB -->
  <g filter="url(#glow)">
    <circle cx="105" cy="55" r="6" fill="#00a651" opacity="0.3"/>
    <circle cx="105" cy="55" r="4" fill="#00d46a" opacity="0.6">
      <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Outgoing data packets -->
    <g fill="#00d46a">
      <circle cx="112" cy="55" r="3">
        <animate attributeName="cx" values="112;127;112" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="112" cy="50" r="2.5">
        <animate attributeName="cx" values="112;127;112" dur="2s" repeatCount="indefinite" begin="0.7s"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite" begin="0.7s"/>
        <animate attributeName="r" values="2.5;1.5;1" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      </circle>
      <circle cx="112" cy="60" r="2.5">
        <animate attributeName="cx" values="112;127;112" dur="2s" repeatCount="indefinite" begin="1.3s"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite" begin="1.3s"/>
        <animate attributeName="r" values="2.5;1.5;1" dur="2s" repeatCount="indefinite" begin="1.3s"/>
      </circle>
    </g>
    <text x="118" y="52" font-family="monospace" font-size="7" fill="#00a651" text-anchor="start" opacity="0.7">→ DB</text>
  </g>
  
  <!-- API label -->
  <text x="60" y="135" font-family="monospace" font-size="10" font-weight="bold" fill="#00a651" text-anchor="middle" opacity="0.8">API GATEWAY</text>
  
  <!-- Connection line label -->
  <text x="60" y="12" font-family="monospace" font-size="7" fill="#00a651" text-anchor="middle" opacity="0.5">← CLIENT REQUESTS → DB QUERIES</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.02); }
      }
      @keyframes data-flow {
        0% { stroke-dashoffset: 20; opacity: 0.3; }
        50% { stroke-dashoffset: 0; opacity: 0.8; }
        100% { stroke-dashoffset: -20; opacity: 0.3; }
      }
      @keyframes blink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    </style>
  </defs>
  
  <!-- Server rack -->
  <rect x="25" y="20" width="70" height="80" rx="4" fill="#1e1e2e" stroke="#2F81F7" stroke-width="1.5"/>
  
  <!-- Server slots -->
  <g fill="#2a2a3e">
    <rect x="30" y="28" width="60" height="14" rx="2">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0s"/>
    </rect>
    <rect x="30" y="48" width="60" height="14" rx="2">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.4s"/>
    </rect>
    <rect x="30" y="68" width="60" height="14" rx="2">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.8s"/>
    </rect>
    <rect x="30" y="88" width="60" height="14" rx="2">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="1.2s"/>
    </rect>
  </g>
  
  <!-- LED lights on servers -->
  <g fill="#2F81F7">
    <circle cx="40" cy="35" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="80" cy="35" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="40" cy="55" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="80" cy="55" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <circle cx="40" cy="75" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="80" cy="75" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="40" cy="95" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    <circle cx="80" cy="95" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
  </g>
  
  <!-- Data flow lines -->
  <g stroke="#2F81F7" stroke-width="1.5" fill="none" stroke-dasharray="8 6">
    <path d="M15 50 Q35 50 35 50">
      <animate attributeName="stroke-dashoffset" values="20;0;-20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M95 50 Q105 50 105 50">
      <animate attributeName="stroke-dashoffset" values="20;0;-20" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M15 70 Q35 70 35 70">
      <animate attributeName="stroke-dashoffset" values="20;0;-20" dur="2s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="1s"/>
    </path>
    <path d="M95 70 Q105 70 105 70">
      <animate attributeName="stroke-dashoffset" values="20;0;-20" dur="2s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </path>
  </g>
  
  <!-- API text -->
  <text x="60" y="115" font-family="monospace" font-size="10" font-weight="bold" fill="#2F81F7" text-anchor="middle" opacity="0.7">API</text>
</svg>
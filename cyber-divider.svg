<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24" preserveAspectRatio="none">
  <defs>
    <linearGradient id="divTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A651" stop-opacity="0"/>
      <stop offset="25%" stop-color="#007540" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00A651" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#007540" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00A651" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="divPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#56d364" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00A651" stop-opacity="0"/>
    </radialGradient>
    <filter id="divGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Track -->
  <line x1="20" y1="12" x2="880" y2="12" stroke="url(#divTrack)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Subtle Center Diamond -->
  <polygon points="450,8 454,12 450,16 446,12" fill="#00A651" opacity="0.8"/>

  <!-- Animated Glowing Data Pulses -->
  <g filter="url(#divGlow)">
    <ellipse cy="12" rx="14" ry="2.2" fill="url(#divPulse)">
      <animate attributeName="cx" values="60;840;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cy="12" rx="10" ry="1.8" fill="url(#divPulse)">
      <animate attributeName="cx" values="840;60;840" dur="8s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Outer 3D Gold Rim -->
    <radialGradient id="jvmGoldRim" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- Inner Dial -->
    <radialGradient id="jvmDial" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a1205"/>
      <stop offset="60%" stop-color="#140701"/>
      <stop offset="100%" stop-color="#050200"/>
    </radialGradient>

    <!-- 3D Shadow -->
    <filter id="jvm3dShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="jvmGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#jvm3dShadow)">
    <!-- Base 3D Coin Outer Bevel -->
    <circle cx="60" cy="56" r="48" fill="url(#jvmGoldRim)"/>
    <!-- Specular Highlight Top Rim -->
    <ellipse cx="60" cy="14" rx="22" ry="4" fill="#ffffff" opacity="0.35"/>
    
    <!-- Inner Recessed Dial -->
    <circle cx="60" cy="56" r="41" fill="url(#jvmDial)" stroke="#f59e0b" stroke-width="1.2"/>
    <!-- Circuit rings -->
    <circle cx="60" cy="56" r="35" fill="none" stroke="#b45309" stroke-width="0.8" stroke-dasharray="2,3"/>

    <!-- 3D Steaming Coffee & Concurrency Core -->
    <g transform="translate(42, 34)">
      <!-- Animated Steam Wisps -->
      <path d="M12,4 Q14,0 16,4 Q18,8 16,11" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round" opacity="0.8">
        <animate attributeName="d" values="M12,4 Q14,0 16,4 Q18,8 16,11; M12,2 Q10,-2 14,2 Q18,6 16,10; M12,4 Q14,0 16,4 Q18,8 16,11" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M22,4 Q24,0 26,4 Q28,8 26,11" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round" opacity="0.8">
        <animate attributeName="d" values="M22,4 Q24,0 26,4 Q28,8 26,11; M22,2 Q24,-2 20,2 Q26,6 24,10; M22,4 Q24,0 26,4 Q28,8 26,11" dur="2.8s" repeatCount="indefinite"/>
      </path>

      <!-- 3D Cup Body -->
      <path d="M6,13 L30,13 L27,33 C26.5,37 9.5,37 9,33 Z" fill="#f59e0b" stroke="#fef08a" stroke-width="1.2" filter="url(#jvmGlow)"/>
      <ellipse cx="18" cy="13" rx="12" ry="3.5" fill="#451a03" stroke="#fef08a" stroke-width="0.8"/>
      <!-- Cup Handle -->
      <path d="M28,17 C34,17 34,27 27,27" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>

      <!-- Concurrency Atom / Core in center of cup -->
      <circle cx="18" cy="24" r="3" fill="#ffffff" filter="url(#jvmGlow)"/>
      <ellipse cx="18" cy="24" rx="7" ry="2.5" fill="none" stroke="#ffffff" stroke-width="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0 18 24" to="360 18 24" dur="4s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- 3D Banner Ribbon at bottom -->
    <g transform="translate(14, 86)">
      <!-- Ribbon Tails -->
      <polygon points="0,6 10,0 8,14" fill="#78350f"/>
      <polygon points="92,6 82,0 84,14" fill="#78350f"/>
      <!-- Ribbon Center Plate -->
      <rect x="6" y="0" width="80" height="17" rx="3" fill="url(#jvmGoldRim)" stroke="#451a03" stroke-width="0.8"/>
      <text x="46" y="12" text-anchor="middle" fill="#451a03" font-family="'JetBrains Mono', sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">
        JVM MASTER
      </text>
    </g>
  </g>
</svg>
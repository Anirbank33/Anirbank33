<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Cup body gradient - clear plastic -->
    <linearGradient id="cupBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8f5e9" stop-opacity="0.15"/>
      <stop offset="20%" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#c8e6c9" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="80%" stop-color="#a5d6a7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e8f5e9" stop-opacity="0.15"/>
    </linearGradient>
    
    <!-- Cup inner gradient -->
    <linearGradient id="cupInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    
    <!-- Starbucks green -->
    <linearGradient id="sbuxGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#006633"/>
      <stop offset="50%" stop-color="#007540"/>
      <stop offset="100%" stop-color="#005a2e"/>
    </linearGradient>
    
    <!-- Straw gradient -->
    <linearGradient id="strawGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006633"/>
      <stop offset="50%" stop-color="#00a651"/>
      <stop offset="100%" stop-color="#006633"/>
    </linearGradient>
    
    <!-- Coffee/liquid gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2c20" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#3d1f18" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#2d1812" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a0d08" stop-opacity="1"/>
    </linearGradient>
    
    <!-- Ice cubes -->
    <radialGradient id="iceGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#b3e5fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#81d4fa" stop-opacity="0.2"/>
    </radialGradient>
    
    <!-- Condensation droplets -->
    <radialGradient id="dropGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e0f2f1" stop-opacity="0.1"/>
    </radialGradient>
    
    <!-- Data flow gradient -->
    <linearGradient id="dataFlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a651" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d46a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00a651" stop-opacity="0"/>
    </linearGradient>
    
    <filter id="plasticGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Shadow under cup -->
  <ellipse cx="60" cy="130" rx="32" ry="6" fill="#000" opacity="0.15" filter="url(#dropShadow)"/>
  
  <!-- Cup body - outer wall (clear plastic) -->
  <path d="M28 20 L22 115 Q22 125 32 125 L88 125 Q98 125 98 115 L92 20 Z" 
        fill="url(#cupBody)" stroke="#00a651" stroke-width="0.5" opacity="0.6" filter="url(#dropShadow)"/>
  
  <!-- Cup body - inner wall -->
  <path d="M32 24 L28 112 Q28 120 36 120 L84 120 Q92 120 92 112 L88 24 Z" 
        fill="url(#cupInner)" stroke="#fff" stroke-width="0.3" opacity="0.3"/>
  
  <!-- Liquid/coffee inside -->
  <path d="M33 45 L30 111 Q30 118 38 118 L82 118 Q90 118 90 111 L87 45 Z" 
        fill="url(#liquidGrad)"/>
  
  <!-- Liquid surface with reflection -->
  <ellipse cx="60" cy="47" rx="24" ry="3" fill="#5d3a30" opacity="0.4"/>
  <ellipse cx="60" cy="49" rx="22" ry="2" fill="#6d4a38" opacity="0.3"/>
  <ellipse cx="60" cy="46" rx="20" ry="1.5" fill="#fff" opacity="0.1"/>
  
  <!-- Ice cubes floating -->
  <g filter="url(#plasticGlow)">
    <rect x="38" y="55" width="10" height="10" rx="2" fill="url(#iceGrad)" transform="rotate(-12 43 60)">
      <animate attributeName="y" values="55;52;55" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.7;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="68" y="60" width="9" height="9" rx="2" fill="url(#iceGrad)" transform="rotate(8 72.5 64.5)">
      <animate attributeName="y" values="60;57;60" dur="3.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.5;0.7;0.5" dur="3.5s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <rect x="52" y="52" width="7" height="7" rx="1.5" fill="url(#iceGrad)" transform="rotate(-5 55.5 55.5)">
      <animate attributeName="y" values="52;49;52" dur="4.5s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.4;0.6;0.4" dur="4.5s" repeatCount="indefinite" begin="2s"/>
    </rect>
  </g>
  
  <!-- Condensation droplets on outside -->
  <g fill="url(#dropGrad)" opacity="0.6">
    <circle cx="35" cy="70" r="1.5">
      <animate attributeName="cy" values="70;100;70" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.5;2;1.5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="75" r="1.2">
      <animate attributeName="cy" values="75;105;75" dur="4.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="r" values="1.2;1.8;1.2" dur="4.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="45" cy="85" r="1">
      <animate attributeName="cy" values="85;115;85" dur="6s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="r" values="1;1.5;1" dur="6s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="75" cy="90" r="1.3">
      <animate attributeName="cy" values="90;120;90" dur="5.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="r" values="1.3;2;1.3" dur="5.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
  
  <!-- Starbucks logo (simplified siren) -->
  <g transform="translate(60, 75) scale(0.6)">
    <circle r="22" fill="url(#sbuxGreen)"/>
    <!-- Siren silhouette simplified -->
    <path d="M0 -18 Q-12 -10 -12 2 Q-12 10 -4 14 Q0 18 4 14 Q12 10 12 2 Q12 -10 0 -18" fill="#fff" opacity="0.9"/>
    <path d="M-6 -4 Q-8 -2 -6 2 Q-4 5 0 5 Q4 5 6 2 Q8 -2 6 -4 Q4 -7 0 -7 Q-4 -7 -6 -4" fill="url(#sbuxGreen)"/>
    <!-- Crown -->
    <path d="M-10 -16 L-10 -22 M0 -16 L0 -24 M10 -16 L10 -22" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-10" cy="-22" r="1.5" fill="#fff"/>
    <circle cx="0" cy="-24" r="1.5" fill="#fff"/>
    <circle cx="10" cy="-22" r="1.5" fill="#fff"/>
  </g>
  
  <!-- Straw -->
  <path d="M80 15 Q90 10 95 5 Q98 0 100 -5" 
        fill="none" stroke="url(#strawGrad)" stroke-width="5" stroke-linecap="round" filter="url(#plasticGlow)">
    <animate attributeName="d" values="M80 15 Q90 10 95 5 Q98 0 100 -5; M80 15 Q92 10 96 5 Q99 0 100 -5; M80 15 Q90 10 95 5 Q98 0 100 -5" dur="3s" repeatCount="indefinite"/>
  </path>
  <!-- Straw highlight -->
  <path d="M81 14 Q90 9 94 4" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
  
  <!-- Lid (clear plastic dome) -->
  <path d="M28 20 Q28 12 60 12 Q92 12 92 20" fill="url(#cupBody)" stroke="#00a651" stroke-width="0.5" opacity="0.5"/>
  <ellipse cx="60" cy="20" rx="32" ry="4" fill="url(#cupInner)" opacity="0.4"/>
  <!-- Lid sip hole -->
  <ellipse cx="78" cy="20" rx="4" ry="2" fill="#1a1a2e" opacity="0.8"/>
  
  <!-- Cup rim highlight -->
  <path d="M28 20 Q28 12 60 12 Q92 12 92 20" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Data output port (right side) - connecting to API -->
  <g filter="url(#plasticGlow)">
    <circle cx="98" cy="75" r="6" fill="#00a651" opacity="0.3"/>
    <circle cx="98" cy="75" r="4" fill="#00d46a" opacity="0.6">
      <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Outgoing data packets -->
    <g fill="#00d46a">
      <circle cx="105" cy="75" r="3">
        <animate attributeName="cx" values="105;120;105" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="105" cy="70" r="2.5">
        <animate attributeName="cx" values="105;120;105" dur="2s" repeatCount="indefinite" begin="0.7s"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite" begin="0.7s"/>
        <animate attributeName="r" values="2.5;1.5;1" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      </circle>
      <circle cx="105" cy="80" r="2.5">
        <animate attributeName="cx" values="105;120;105" dur="2s" repeatCount="indefinite" begin="1.3s"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite" begin="1.3s"/>
        <animate attributeName="r" values="2.5;1.5;1" dur="2s" repeatCount="indefinite" begin="1.3s"/>
      </circle>
    </g>
    <text x="108" y="72" font-family="monospace" font-size="7" fill="#00a651" text-anchor="start" opacity="0.7">→ API</text>
  </g>
  
  <!-- CLIENT label -->
  <text x="60" y="138" font-family="monospace" font-size="9" font-weight="bold" fill="#00a651" text-anchor="middle" opacity="0.8">CLIENT</text>
</svg>
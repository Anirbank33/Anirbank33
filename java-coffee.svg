<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a3e"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5d3a36"/>
      <stop offset="30%" stop-color="#3d1f1d"/>
      <stop offset="100%" stop-color="#1a0d0c"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#2F81F7"/>
    </linearGradient>
    <radialGradient id="steamGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ccc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#888" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Shadow under cup -->
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="#000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Cup body with 3D gradient -->
  <path d="M35 35 L30 95 Q30 105 40 105 L80 105 Q90 105 90 95 L85 35 Z" fill="url(#cupGrad)" stroke="url(#handleGrad)" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Cup inner highlight (3D rim) -->
  <path d="M38 35 L35 92 Q35 100 43 100 L77 100 Q85 100 85 92 L82 35 Z" fill="none" stroke="#3a7bd5" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Coffee with gradient -->
  <path d="M38 40 L36 92 Q36 100 44 100 L76 100 Q84 100 84 92 L82 40 Z" fill="url(#coffeeGrad)"/>
  
  <!-- Coffee surface with reflection -->
  <ellipse cx="60" cy="44" rx="20" ry="3" fill="#6a4a44" opacity="0.5"/>
  <ellipse cx="60" cy="46" rx="18" ry="2" fill="#7a5a54" opacity="0.3"/>
  
  <!-- 3D Handle with gradient -->
  <path d="M85 50 Q105 50 105 70 Q105 90 85 90" fill="none" stroke="url(#handleGrad)" stroke-width="4" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M88 52 Q100 52 100 70 Q100 88 88 88" fill="none" stroke="#1e1e2e" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Steam paths (static, animated via transform) -->
  <defs>
    <path id="steamPath" d="M-5 0 Q-5 -20 0 -25 Q5 -20 5 0" fill="none" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" filter="url(#glow)"/>
    <path id="steamPathThin" d="M-5 0 Q-5 -15 0 -18 Q5 -15 5 0" fill="none" stroke="url(#steamGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>
    <path id="steamPathThinner" d="M-3 0 Q-3 -12 0 -15 Q3 -12 3 0" fill="none" stroke="url(#steamGrad)" stroke-width="1" stroke-linecap="round" opacity="0.4" filter="url(#glow)"/>
  </defs>
  
  <!-- Steam 1 (center) - rises and fades -->
  <use href="#steamPath" x="60" y="35">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -40; 0 -60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;1.5;1" dur="3s" repeatCount="indefinite"/>
  </use>
  
  <!-- Steam 2 (left) -->
  <use href="#steamPathThin" x="45" y="35">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -35; 0 -55" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="stroke-width" values="1.5;1;0.5" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
  </use>
  
  <!-- Steam 3 (right) -->
  <use href="#steamPathThin" x="75" y="35">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -35; 0 -55" dur="3.2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="3.2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="stroke-width" values="1.5;1;0.5" dur="3.2s" repeatCount="indefinite" begin="1s"/>
  </use>
  
  <!-- Steam 4 (far left) -->
  <use href="#steamPathThinner" x="38" y="38">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -30; 0 -50" dur="4s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="4s" repeatCount="indefinite" begin="0.2s"/>
  </use>
  
  <!-- Steam 5 (far right) -->
  <use href="#steamPathThinner" x="82" y="38">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -30; 0 -50" dur="3.8s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="3.8s" repeatCount="indefinite" begin="1.5s"/>
  </use>
  
  <!-- Java text on cup with 3D effect -->
  <text x="60" y="80" font-family="monospace" font-size="16" font-weight="bold" fill="#2F81F7" text-anchor="middle" opacity="0.9" filter="url(#glow)">JAVA</text>
  <text x="60" y="80" font-family="monospace" font-size="16" font-weight="bold" fill="#1e1e2e" text-anchor="middle" opacity="0.3" dx="1" dy="1">JAVA</text>
  
  <!-- Coffee beans with 3D shading -->
  <g transform="rotate(-20 25 100)">
    <ellipse cx="25" cy="100" rx="4" ry="2.5" fill="#2d1816"/>
    <ellipse cx="25" cy="100" rx="3" ry="1.5" fill="#4a2c28" opacity="0.6"/>
  </g>
  <g transform="rotate(20 95 100)">
    <ellipse cx="95" cy="100" rx="4" ry="2.5" fill="#2d1816"/>
    <ellipse cx="95" cy="100" rx="3" ry="1.5" fill="#4a2c28" opacity="0.6"/>
  </g>
  <g transform="rotate(-35 15 105)">
    <ellipse cx="15" cy="105" rx="3" ry="2" fill="#2d1816"/>
    <ellipse cx="15" cy="105" rx="2" ry="1" fill="#4a2c28" opacity="0.6"/>
  </g>
  <g transform="rotate(35 105 105)">
    <ellipse cx="105" cy="105" rx="3" ry="2" fill="#2d1816"/>
    <ellipse cx="105" cy="105" rx="2" ry="1" fill="#4a2c28" opacity="0.6"/>
  </g>
  
  <!-- Subtle glow ring pulsing -->
  <circle cx="60" cy="65" r="35" fill="none" stroke="#2F81F7" stroke-width="0.5" opacity="0.2">
    <animate attributeName="r" values="35;45;35" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Floating particles -->
  <g fill="#2F81F7" opacity="0.6">
    <circle cx="20" cy="60" r="1.5">
      <animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="70" r="1">
      <animate attributeName="cy" values="70;50;70" dur="4.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="15" cy="80" r="1">
      <animate attributeName="cy" values="80;60;80" dur="6s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="6s" repeatCount="indefinite" begin="2s"/>
    </circle>
  </g>
</svg>
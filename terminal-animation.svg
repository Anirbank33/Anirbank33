<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      @keyframes typewriter {
        0% { width: 0; }
        50% { width: 45px; }
        100% { width: 0; }
      }
      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>
  
  <!-- Terminal window -->
  <rect x="15" y="20" width="90" height="80" rx="6" fill="#1e1e2e" stroke="#2F81F7" stroke-width="1.5"/>
  
  <!-- Title bar -->
  <rect x="15" y="20" width="90" height="22" rx="6" fill="#2a2a3e"/>
  <rect x="15" y="20" width="90" height="22" fill="none" stroke="#2F81F7" stroke-width="1.5"/>
  
  <!-- Traffic lights -->
  <circle cx="25" cy="31" r="4" fill="#ff5f57"/>
  <circle cx="37" cy="31" r="4" fill="#febc2e"/>
  <circle cx="49" cy="31" r="4" fill="#28ca42"/>
  
  <!-- Terminal prompt -->
  <text x="25" y="55" font-family="monospace" font-size="11" fill="#888" opacity="0.6">$</text>
  
  <!-- Typing animation lines -->
  <g font-family="monospace" font-size="11" fill="#2F81F7">
    <text x="35" y="55">
      <tspan x="35" dy="0">npm run dev</tspan>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="35" y="72">
      <tspan x="35" dy="0">Starting server...</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="35" y="89">
      <tspan x="35" dy="0">Server on :8080 ✓</tspan>
      <animate attributeName="opacity" values="0;0;0;1;1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Cursor blinking -->
  <rect x="125" y="53" width="8" height="14" fill="#2F81F7">
    <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Side indicators -->
  <g stroke="#2F81F7" stroke-width="1.5" fill="none" stroke-dasharray="4 4" opacity="0.4">
    <path d="M10 60 Q20 60 20 60">
      <animate attributeName="stroke-dashoffset" values="8;0;-8" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M100 60 Q110 60 110 60">
      <animate attributeName="stroke-dashoffset" values="8;0;-8" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </path>
  </g>
  
  <!-- Code text -->
  <text x="60" y="115" font-family="monospace" font-size="10" font-weight="bold" fill="#2F81F7" text-anchor="middle" opacity="0.7">CODE</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a3e"/>
      <stop offset="15%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3a4e"/>
      <stop offset="50%" stop-color="#2a2a3e"/>
      <stop offset="100%" stop-color="#3a3a4e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F81F7"/>
      <stop offset="50%" stop-color="#4db8ff"/>
      <stop offset="100%" stop-color="#2F81F7"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4db8ff"/>
      <stop offset="100%" stop-color="#2F81F7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="screenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow under terminal -->
  <ellipse cx="60" cy="108" rx="50" ry="6" fill="#000" opacity="0.25" filter="url(#shadow)"/>
  
  <!-- Terminal window with 3D gradient -->
  <rect x="15" y="20" width="90" height="80" rx="8" fill="url(#termGrad)" stroke="#2F81F7" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Terminal front edge highlight -->
  <path d="M15 20 L15 100" fill="none" stroke="#3a7bd5" stroke-width="1" opacity="0.4"/>
  <path d="M105 20 L105 100" fill="none" stroke="#1a1a2a" stroke-width="1" opacity="0.5"/>
  
  <!-- Title bar with gradient -->
  <rect x="15" y="20" width="90" height="26" rx="8" fill="url(#titleGrad)"/>
  <rect x="15" y="20" width="90" height="26" fill="none" stroke="#2F81F7" stroke-width="1" opacity="0.3"/>
  
  <!-- Traffic lights with 3D effect -->
  <g filter="url(#glow)">
    <circle cx="25" cy="33" r="5" fill="#ff5f57">
      <animate attributeName="r" values="5;5.5;5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="33" r="2" fill="#ff9f9a" opacity="0.5"/>
    <circle cx="39" cy="33" r="5" fill="#febc2e">
      <animate attributeName="r" values="5;5.5;5" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="39" cy="33" r="2" fill="#fee69a" opacity="0.5"/>
    <circle cx="53" cy="33" r="5" fill="#28ca42">
      <animate attributeName="r" values="5;5.5;5" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="53" cy="33" r="2" fill="#9aff9a" opacity="0.5"/>
  </g>
  
  <!-- Terminal title text -->
  <text x="75" y="37" font-family="monospace" font-size="8" fill="#888" text-anchor="middle" opacity="0.5">bash</text>
  
  <!-- Screen content area -->
  <rect x="20" y="52" width="80" height="45" rx="3" fill="#0d0d14" opacity="0.9" filter="url(#screenGlow)"/>
  
  <!-- Prompt and typing animation -->
  <g font-family="monospace" font-size="11" fill="url(#textGrad)" filter="url(#glow)">
    <!-- Line 1: prompt + command -->
    <text x="25" y="70">
      <tspan x="25" fill="#888" opacity="0.6">$</tspan>
      <tspan x="33" dy="0" opacity="0">npm run dev</tspan>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="5s" repeatCount="indefinite"/>
    </text>
    
    <!-- Line 2: starting -->
    <text x="25" y="87">
      <tspan x="25" dy="0" opacity="0">Starting server...</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" dur="5s" repeatCount="indefinite"/>
    </text>
    
    <!-- Line 3: success -->
    <text x="25" y="104">
      <tspan x="25" dy="0" fill="#28ca42" opacity="0">Server running on :8080 ✓</tspan>
      <animate attributeName="opacity" values="0;0;0;1;1" dur="5s" repeatCount="indefinite"/>
    </text>
    
    <!-- Line 4: ready -->
    <text x="25" y="121">
      <tspan x="25" dy="0" opacity="0">Ready for requests →</tspan>
      <animate attributeName="opacity" values="0;0;0;0;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Blinking cursor -->
  <rect x="115" y="68" width="8" height="16" rx="1" fill="url(#cursorGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="height" values="16;14;16" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Data flow lines on sides -->
  <g stroke="url(#textGrad)" stroke-width="1.5" fill="none" stroke-dasharray="6 4" opacity="0.4" filter="url(#glow)">
    <path d="M8 70 Q20 70 20 70">
      <animate attributeName="stroke-dashoffset" values="12;0;-12" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M100 70 Q112 70 112 70">
      <animate attributeName="stroke-dashoffset" values="12;0;-12" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
    </path>
    <path d="M8 85 Q20 85 20 85">
      <animate attributeName="stroke-dashoffset" values="12;0;-12" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
    </path>
    <path d="M100 85 Q112 85 112 85">
      <animate attributeName="stroke-dashoffset" values="12;0;-12" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
    </path>
  </g>
  
  <!-- Floating code particles -->
  <g fill="#4db8ff" filter="url(#glow)">
    <circle cx="10" cy="60" r="1.5">
      <animate attributeName="cx" values="10;18;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="90" r="1">
      <animate attributeName="cx" values="110;102;110" dur="2.5s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2.5s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
  </g>
  
  <!-- CODE text with 3D effect -->
  <text x="60" y="115" font-family="monospace" font-size="11" font-weight="bold" fill="#2F81F7" text-anchor="middle" opacity="0.8" filter="url(#glow)">CODE</text>
  <text x="60" y="115" font-family="monospace" font-size="11" font-weight="bold" fill="#0f0f1a" text-anchor="middle" opacity="0.3" dx="1" dy="1">CODE</text>
</svg>
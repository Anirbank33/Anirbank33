<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="15%" stop-color="#1a1a2a"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2a3e"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#2a2a3e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a651"/>
      <stop offset="50%" stop-color="#00d46a"/>
      <stop offset="100%" stop-color="#00a651"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d46a"/>
      <stop offset="100%" stop-color="#00a651"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a651" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d46a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00a651" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="screenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow under terminal -->
  <ellipse cx="60" cy="130" rx="50" ry="6" fill="#000" opacity="0.25" filter="url(#shadow)"/>
  
  <!-- Data input pipe from DB (left side) -->
  <g filter="url(#glow)">
    <path d="M-10 75 Q25 75 25 75" stroke="url(#pipeGrad)" stroke-width="3" fill="none" stroke-dasharray="8 6" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="16;0;-16" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <!-- Incoming log packets from DB -->
    <g fill="#00d46a">
      <circle cx="15" cy="75" r="3">
        <animate attributeName="cx" values="15;27;15" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;2;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="71" r="2.5">
        <animate attributeName="cx" values="15;27;15" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
        <animate attributeName="r" values="2.5;1.5;1" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <circle cx="15" cy="79" r="2.5">
        <animate attributeName="cx" values="15;27;15" dur="1.5s" repeatCount="indefinite" begin="1s"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" repeatCount="indefinite" begin="1s"/>
        <animate attributeName="r" values="2.5;1.5;1" dur="1.5s" repeatCount="indefinite" begin="1s"/>
      </circle>
    </g>
    <text x="18" y="70" font-family="monospace" font-size="7" fill="#00a651" text-anchor="middle" opacity="0.7">DB →</text>
  </g>
  
  <!-- Terminal window with 3D gradient -->
  <rect x="15" y="20" width="90" height="95" rx="8" fill="url(#termGrad)" stroke="#00a651" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Terminal front edge highlight -->
  <path d="M15 20 L15 115" fill="none" stroke="#00a651" stroke-width="1" opacity="0.3"/>
  <path d="M105 20 L105 115" fill="none" stroke="#0f0f1a" stroke-width="1" opacity="0.5"/>
  
  <!-- Title bar with gradient -->
  <rect x="15" y="20" width="90" height="28" rx="8" fill="url(#titleGrad)"/>
  <rect x="15" y="20" width="90" height="28" fill="none" stroke="#00a651" stroke-width="1" opacity="0.3"/>
  
  <!-- Traffic lights with 3D effect -->
  <g filter="url(#glow)">
    <circle cx="25" cy="34" r="5" fill="#ff5f57">
      <animate attributeName="r" values="5;5.5;5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="34" r="2" fill="#ff9f9a" opacity="0.5"/>
    <circle cx="39" cy="34" r="5" fill="#febc2e">
      <animate attributeName="r" values="5;5.5;5" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="39" cy="34" r="2" fill="#fee69a" opacity="0.5"/>
    <circle cx="53" cy="34" r="5" fill="#28ca42">
      <animate attributeName="r" values="5;5.5;5" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="53" cy="34" r="2" fill="#9aff9a" opacity="0.5"/>
  </g>
  
  <!-- Terminal title text -->
  <text x="75" y="38" font-family="monospace" font-size="8" fill="#888" text-anchor="middle" opacity="0.5">bash</text>
  <text x="95" y="38" font-family="monospace" font-size="7" fill="#00a651" text-anchor="middle" opacity="0.6">tail -f logs</text>
  
  <!-- Screen content area -->
  <rect x="20" y="55" width="80" height="55" rx="3" fill="#0d0d14" opacity="0.9" filter="url(#screenGlow)"/>
  
  <!-- Prompt and typing animation -->
  <g font-family="monospace" font-size="10" fill="url(#textGrad)" filter="url(#glow)">
    <!-- Line 1: prompt + command -->
    <text x="25" y="72">
      <tspan x="25" fill="#888" opacity="0.5">$</tspan>
      <tspan x="33" dy="0" opacity="0">tail -f /var/log/app.log</tspan>
      <animate attributeName="opacity" values="0;1;1;1;1;0" dur="6s" repeatCount="indefinite"/>
    </text>
    
    <!-- Line 2: incoming log -->
    <text x="25" y="88">
      <tspan x="25" dy="0" opacity="0">[INFO] Request received from CLIENT</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" dur="6s" repeatCount="indefinite"/>
    </text>
    
    <!-- Line 3: processing -->
    <text x="25" y="104">
      <tspan x="25" dy="0" opacity="0">[INFO] API Gateway processing...</tspan>
      <animate attributeName="opacity" values="0;0;0;1;1;0" dur="6s" repeatCount="indefinite"/>
    </text>
    
    <!-- Line 4: db query -->
    <text x="25" y="120">
      <tspan x="25" dy="0" opacity="0">[DEBUG] DB query executed ✓</tspan>
      <animate attributeName="opacity" values="0;0;0;0;1;1" dur="6s" repeatCount="indefinite"/>
    </text>
    
    <!-- Line 5: response -->
    <text x="25" y="136">
      <tspan x="25" dy="0" fill="#00d46a" opacity="0">[SUCCESS] Response sent → CLIENT ✓</tspan>
      <animate attributeName="opacity" values="0;0;0;0;0;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Blinking cursor -->
  <rect x="105" y="70" width="7" height="14" rx="1" fill="url(#cursorGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="height" values="14;12;14" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Floating log particles -->
  <g fill="#00d46a" filter="url(#glow)">
    <circle cx="10" cy="60" r="1.5">
      <animate attributeName="cx" values="10;18;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="100" r="1">
      <animate attributeName="cx" values="110;102;110" dur="2.5s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2.5s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
  </g>
  
  <!-- TERMINAL label -->
  <text x="60" y="135" font-family="monospace" font-size="10" font-weight="bold" fill="#00a651" text-anchor="middle" opacity="0.8">TERMINAL</text>
  
  <!-- Connection line label -->
  <text x="60" y="12" font-family="monospace" font-size="7" fill="#00a651" text-anchor="middle" opacity="0.5">← DB LOGS → DEV MONITORING</text>
</svg>
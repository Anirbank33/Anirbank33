name: Generate Arcade Contribution Games

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Puzzle Bobble animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Anirbank33
          games: puzzle-bobble

      - name: Generate Pac-Man animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Anirbank33
          games: pacman

      - name: Generate Breakout animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Anirbank33
          games: breakout

      - name: Generate Galaga animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Anirbank33
          games: galaga

      - name: Generate Bomberman animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Anirbank33
          games: bomberman

      - name: Generate Snake animation
        uses: Platane/snk@master
        with:
          github_user_name: Anirbank33
          svg_out_path: dist/github-contribution-grid-snake.svg

      - name: Generate Snake animation (dark)
        uses: Platane/snk@master
        with:
          github_user_name: Anirbank33
          svg_out_path: dist/github-contribution-grid-snake-dark.svg
          args: --theme github-dark

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
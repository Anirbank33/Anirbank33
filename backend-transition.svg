<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 76" width="100%" height="76" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes phase1 {
        0%, 21% { opacity: 1; transform: translateY(0px); }
        25%, 96% { opacity: 0; transform: translateY(-5px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes phase2 {
        0%, 21% { opacity: 0; transform: translateY(5px); }
        25%, 46% { opacity: 1; transform: translateY(0px); }
        50%, 100% { opacity: 0; transform: translateY(-5px); }
      }
      @keyframes phase3 {
        0%, 46% { opacity: 0; transform: translateY(5px); }
        50%, 71% { opacity: 1; transform: translateY(0px); }
        75%, 100% { opacity: 0; transform: translateY(-5px); }
      }
      @keyframes phase4 {
        0%, 71% { opacity: 0; transform: translateY(5px); }
        75%, 96% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0; transform: translateY(-5px); }
      }

      .p1 { animation: phase1 16s ease-in-out infinite; }
      .p2 { animation: phase2 16s ease-in-out infinite; }
      .p3 { animation: phase3 16s ease-in-out infinite; }
      .p4 { animation: phase4 16s ease-in-out infinite; }

      @keyframes eq1 { 0%, 100% { height: 4px; y: 10px; } 50% { height: 14px; y: 0px; } }
      @keyframes eq2 { 0%, 100% { height: 12px; y: 2px; } 50% { height: 5px; y: 9px; } }
      @keyframes eq3 { 0%, 100% { height: 6px; y: 8px; } 50% { height: 14px; y: 0px; } }
      @keyframes eq4 { 0%, 100% { height: 11px; y: 3px; } 50% { height: 4px; y: 10px; } }
      @keyframes eq5 { 0%, 100% { height: 5px; y: 9px; } 50% { height: 13px; y: 1px; } }

      .eq-bar1 { animation: eq1 1.2s ease-in-out infinite; }
      .eq-bar2 { animation: eq2 1.4s ease-in-out infinite; }
      .eq-bar3 { animation: eq3 1.1s ease-in-out infinite; }
      .eq-bar4 { animation: eq4 1.3s ease-in-out infinite; }
      .eq-bar5 { animation: eq5 1.5s ease-in-out infinite; }

      @keyframes pulseAura { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.35; } }
      .aura { animation: pulseAura 2.5s ease-in-out infinite; }

      @keyframes laserMove {
        0% { x1: 12; x2: 250; }
        50% { x1: 600; x2: 868; }
        100% { x1: 12; x2: 250; }
      }
      .laser { animation: laserMove 6s ease-in-out infinite; }
    </style>

    <!-- Background Gradient -->
    <linearGradient id="hdrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>

    <!-- Glowing Spectrum Border -->
    <linearGradient id="spectrumBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="25%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- 3D Chip Gradients -->
    <linearGradient id="chipTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="chipSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hdrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="1" y="1" width="878" height="74" rx="10" fill="url(#hdrBg)" stroke="#1f2937" stroke-width="1.2"/>

  <!-- Static Base Track -->
  <line x1="12" y1="1.5" x2="868" y2="1.5" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Top Accent Laser Line -->
  <line class="laser" x1="12" y1="1.5" x2="320" y2="1.5" stroke="url(#spectrumBorder)" stroke-width="2" stroke-linecap="round" opacity="0.95"/>

  <!-- ================= LEFT: 3D BACKEND CORE CHIP ================= -->
  <g transform="translate(32, 38)">
    <!-- Breathing Glow Aura -->
    <circle class="aura" cx="0" cy="0" r="20" fill="#00f0ff" filter="url(#hdrGlow)"/>

    <!-- 3D Isometric Mini Hexagon Chip -->
    <polygon points="0,-15 13,-7 13,7 0,15 -13,7 -13,-7" fill="url(#chipSide)"/>
    <polygon points="0,-15 13,-7 0,1 -13,-7" fill="url(#chipTop)"/>
    <polygon points="-13,-7 0,1 0,15 -13,7" fill="#0284c7" opacity="0.65"/>

    <!-- Center Label -->
    <text x="0" y="3.5" fill="#ffffff" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" font-weight="900" text-anchor="middle">BE</text>

    <!-- Orbiting Micro Particle -->
    <circle cx="0" cy="-18" r="1.6" fill="#00f0ff" filter="url(#hdrGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Vertical Divider -->
  <line x1="68" y1="16" x2="68" y2="60" stroke="#1f2937" stroke-width="1.2"/>

  <!-- ================= CENTER: 4-PHASE SKILL TRANSITION ================= -->

  <!-- PHASE 1: JAVA & SPRING BOOT (0s - 4s) -->
  <g transform="translate(84, 0)">
    <g class="p1">
      <text x="0" y="31" fill="#00f0ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="800" letter-spacing="0.4" xml:space="preserve">⚡ BACKEND ARCHITECT  ·  JAVA &amp; SPRING BOOT</text>
      <text x="0" y="52" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" xml:space="preserve"><tspan fill="#38bdf8">☕ Java 17+</tspan><tspan fill="#475569">  •  </tspan><tspan fill="#38bdf8">🍃 Spring Boot 3</tspan><tspan fill="#475569">  •  </tspan><tspan fill="#38bdf8">🚀 High-Concurrency APIs</tspan><tspan fill="#475569">  •  </tspan><tspan fill="#38bdf8">⚙️ JVM Multi-Threading</tspan></text>
    </g>
  </g>

  <!-- PHASE 2: NODE.JS & APIS (4s - 8s) -->
  <g transform="translate(84, 0)">
    <g class="p2">
      <text x="0" y="31" fill="#ec4899" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="800" letter-spacing="0.4" xml:space="preserve">🔮 DISTRIBUTED APIS  ·  NODE.JS &amp; TYPESCRIPT</text>
      <text x="0" y="52" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" xml:space="preserve"><tspan fill="#f472b6">⚡ Node.js Runtime</tspan><tspan fill="#475569">  •  </tspan><tspan fill="#f472b6">🔷 TypeScript</tspan><tspan fill="#475569">  •  </tspan><tspan fill="#f472b6">🛡️ Express &amp; REST Gateways</tspan><tspan fill="#475569">  •  </tspan><tspan fill="#f472b6">🔒 JWT &amp; Auth Layers</tspan></text>
    </g>
  </g>

  <!-- PHASE 3: DATA & STORAGE (8s - 12s) -->
  <g transform="translate(84, 0)">
    <g class="p3">
      <text x="0" y="31" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="800" letter-spacing="0.4" xml:space="preserve">💾 DATA ARCHITECTURE  ·  STORAGE &amp; RESILIENCE</text>
      <text x="0" y="52" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" xml:space="preserve"><tspan fill="#34d399">🐘 PostgreSQL</tspan><tspan fill="#475569">  •  </tspan><tspan fill="#34d399">🍃 MongoDB</tspan><tspan fill="#475569">  •  </tspan><tspan fill="#34d399">⚡ Redis Caching</tspan><tspan fill="#475569">  •  </tspan><tspan fill="#34d399">📊 ACID &amp; Data Pipelines</tspan></text>
    </g>
  </g>

  <!-- PHASE 4: DEVOPS & INFRA (12s - 16s) -->
  <g transform="translate(84, 0)">
    <g class="p4">
      <text x="0" y="31" fill="#fbbf24" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="800" letter-spacing="0.4" xml:space="preserve">🚀 CLOUD &amp; DEVOPS  ·  OBSERVABILITY &amp; DELIVERY</text>
      <text x="0" y="52" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" xml:space="preserve"><tspan fill="#fde047">🐳 Docker Containers</tspan><tspan fill="#475569">  •  </tspan><tspan fill="#fde047">⚡ GitHub Actions CI/CD</tspan><tspan fill="#475569">  •  </tspan><tspan fill="#fde047">🐧 Linux Systems</tspan><tspan fill="#475569">  •  </tspan><tspan fill="#fde047">📈 Telemetry &amp; Logs</tspan></text>
    </g>
  </g>

  <!-- ================= RIGHT: TELEMETRY & EQUALIZER ================= -->
  <g transform="translate(734, 24)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="118" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>

    <!-- Pulse LED -->
    <circle cx="14" cy="14" r="3.5" fill="#10b981" filter="url(#hdrGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="23" y="17.5" fill="#f0f6fc" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700">ONLINE</text>

    <!-- Animated Equalizer Spectrum Bars -->
    <g transform="translate(68, 8)">
      <!-- Bar 1 (Cyan) -->
      <rect class="eq-bar1" x="0" y="3" width="3" height="9" rx="1.5" fill="#00f0ff"/>
      <!-- Bar 2 (Purple) -->
      <rect class="eq-bar2" x="6" y="2" width="3" height="10" rx="1.5" fill="#a855f7"/>
      <!-- Bar 3 (Pink) -->
      <rect class="eq-bar3" x="12" y="5" width="3" height="7" rx="1.5" fill="#ec4899"/>
      <!-- Bar 4 (Gold) -->
      <rect class="eq-bar4" x="18" y="1" width="3" height="11" rx="1.5" fill="#fbbf24"/>
      <!-- Bar 5 (Green) -->
      <rect class="eq-bar5" x="24" y="4" width="3" height="8" rx="1.5" fill="#10b981"/>
    </g>
  </g>
</svg>

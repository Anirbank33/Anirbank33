<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 76" width="100%" height="76" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hdrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>

    <!-- Glowing Spectrum Border -->
    <linearGradient id="spectrumBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="25%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- 3D Chip Gradients -->
    <linearGradient id="chipTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="chipSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hdrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="1" y="1" width="878" height="74" rx="10" fill="url(#hdrBg)" stroke="#1f2937" stroke-width="1.2"/>

  <!-- Top Accent Laser Line -->
  <line x1="12" y1="1.5" x2="868" y2="1.5" stroke="url(#spectrumBorder)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

  <!-- ================= LEFT: 3D BACKEND CORE CHIP ================= -->
  <g transform="translate(32, 38)">
    <!-- Breathing Glow Aura -->
    <circle cx="0" cy="0" r="20" fill="#00f0ff" opacity="0.12" filter="url(#hdrGlow)">
      <animate attributeName="opacity" values="0.08;0.22;0.08" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- 3D Isometric Mini Hexagon Chip -->
    <polygon points="0,-15 13,-7 13,7 0,15 -13,7 -13,-7" fill="url(#chipSide)"/>
    <polygon points="0,-15 13,-7 0,1 -13,-7" fill="url(#chipTop)"/>
    <polygon points="-13,-7 0,1 0,15 -13,7" fill="#0284c7" opacity="0.65"/>

    <!-- Center Label -->
    <text x="0" y="3" fill="#ffffff" font-family="'JetBrains Mono', Consolas, monospace" font-size="7.5" font-weight="900" text-anchor="middle">BE</text>

    <!-- Orbiting Micro Particle -->
    <circle cx="0" cy="-18" r="1.6" fill="#00f0ff" filter="url(#hdrGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Vertical Divider -->
  <line x1="68" y1="16" x2="68" y2="60" stroke="#1f2937" stroke-width="1.2"/>

  <!-- ================= CENTER: 4-PHASE SKILL TRANSITION ================= -->

  <!-- PHASE 1: JAVA & SPRING BOOT (0s - 3.5s) -->
  <g transform="translate(84, 0)">
    <g>
      <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.03; 0.22; 0.25; 1" dur="14s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,4; 0,0; 0,0; 0,-4; 0,-4" keyTimes="0; 0.03; 0.22; 0.25; 1" dur="14s" repeatCount="indefinite"/>

      <!-- Role Title -->
      <text x="0" y="31" fill="#00f0ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="800" letter-spacing="0.4">
        ⚡ BACKEND ARCHITECT &nbsp;·&nbsp; JAVA &amp; SPRING BOOT
      </text>

      <!-- Skills Subtitle -->
      <text x="0" y="52" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500">
        <tspan fill="#38bdf8">☕ Java 17+</tspan>
        <tspan fill="#475569"> • </tspan>
        <tspan fill="#38bdf8">🍃 Spring Boot 3</tspan>
        <tspan fill="#475569"> • </tspan>
        <tspan fill="#38bdf8">🚀 High-Concurrency APIs</tspan>
        <tspan fill="#475569"> • </tspan>
        <tspan fill="#38bdf8">⚙️ Multi-Threading &amp; JVM</tspan>
      </text>
    </g>
  </g>

  <!-- PHASE 2: NODE.JS & APIS (3.5s - 7.0s) -->
  <g transform="translate(84, 0)">
    <g>
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.25; 0.28; 0.47; 0.50; 1" dur="14s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,4; 0,4; 0,0; 0,0; 0,-4; 0,-4" keyTimes="0; 0.25; 0.28; 0.47; 0.50; 1" dur="14s" repeatCount="indefinite"/>

      <!-- Role Title -->
      <text x="0" y="31" fill="#ec4899" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="800" letter-spacing="0.4">
        🔮 DISTRIBUTED APIS &nbsp;·&nbsp; NODE.JS &amp; TYPESCRIPT
      </text>

      <!-- Skills Subtitle -->
      <text x="0" y="52" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500">
        <tspan fill="#f472b6">⚡ Node.js Runtime</tspan>
        <tspan fill="#475569"> • </tspan>
        <tspan fill="#f472b6">🔷 TypeScript</tspan>
        <tspan fill="#475569"> • </tspan>
        <tspan fill="#f472b6">🛡️ Express &amp; REST Gateways</tspan>
        <tspan fill="#475569"> • </tspan>
        <tspan fill="#f472b6">🔒 JWT &amp; Auth Layers</tspan>
      </text>
    </g>
  </g>

  <!-- PHASE 3: DATA & STORAGE (7.0s - 10.5s) -->
  <g transform="translate(84, 0)">
    <g>
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.50; 0.53; 0.72; 0.75; 1" dur="14s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,4; 0,4; 0,0; 0,0; 0,-4; 0,-4" keyTimes="0; 0.50; 0.53; 0.72; 0.75; 1" dur="14s" repeatCount="indefinite"/>

      <!-- Role Title -->
      <text x="0" y="31" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="800" letter-spacing="0.4">
        💾 DATA ARCHITECTURE &nbsp;·&nbsp; STORAGE &amp; RESILIENCE
      </text>

      <!-- Skills Subtitle -->
      <text x="0" y="52" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500">
        <tspan fill="#34d399">🐘 PostgreSQL</tspan>
        <tspan fill="#475569"> • </tspan>
        <tspan fill="#34d399">🍃 MongoDB</tspan>
        <tspan fill="#475569"> • </tspan>
        <tspan fill="#34d399">⚡ Redis Caching</tspan>
        <tspan fill="#475569"> • </tspan>
        <tspan fill="#34d399">📊 ACID &amp; Data Pipeline Design</tspan>
      </text>
    </g>
  </g>

  <!-- PHASE 4: DEVOPS & INFRA (10.5s - 14.0s) -->
  <g transform="translate(84, 0)">
    <g>
      <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.75; 0.78; 0.97; 1" dur="14s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,4; 0,4; 0,0; 0,0; 0,-4" keyTimes="0; 0.75; 0.78; 0.97; 1" dur="14s" repeatCount="indefinite"/>

      <!-- Role Title -->
      <text x="0" y="31" fill="#fbbf24" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="800" letter-spacing="0.4">
        🚀 CLOUD &amp; DEVOPS &nbsp;·&nbsp; OBSERVABILITY &amp; DELIVERY
      </text>

      <!-- Skills Subtitle -->
      <text x="0" y="52" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500">
        <tspan fill="#fde047">🐳 Docker Containers</tspan>
        <tspan fill="#475569"> • </tspan>
        <tspan fill="#fde047">⚡ GitHub Actions CI/CD</tspan>
        <tspan fill="#475569"> • </tspan>
        <tspan fill="#fde047">🐧 Linux Systems</tspan>
        <tspan fill="#475569"> • </tspan>
        <tspan fill="#fde047">📈 Telemetry &amp; Logs</tspan>
      </text>
    </g>
  </g>

  <!-- ================= RIGHT: TELEMETRY & EQUALIZER ================= -->
  <g transform="translate(734, 24)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="118" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>

    <!-- Pulse LED -->
    <circle cx="14" cy="14" r="3.5" fill="#10b981" filter="url(#hdrGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="23" y="18" fill="#f0f6fc" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700">ONLINE</text>

    <!-- Animated Equalizer Spectrum Bars -->
    <g transform="translate(68, 8)">
      <!-- Bar 1 (Cyan) -->
      <rect x="0" y="3" width="3" height="9" rx="1.5" fill="#00f0ff">
        <animate attributeName="height" values="4;12;6;14;4" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;2;8;0;10" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 2 (Purple) -->
      <rect x="6" y="2" width="3" height="10" rx="1.5" fill="#a855f7">
        <animate attributeName="height" values="12;5;13;7;12" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="2;9;1;7;2" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 3 (Pink) -->
      <rect x="12" y="5" width="3" height="7" rx="1.5" fill="#ec4899">
        <animate attributeName="height" values="6;14;5;11;6" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="8;0;9;3;8" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 4 (Gold) -->
      <rect x="18" y="1" width="3" height="11" rx="1.5" fill="#fbbf24">
        <animate attributeName="height" values="10;4;12;6;10" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="4;10;2;8;4" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 5 (Green) -->
      <rect x="24" y="4" width="3" height="8" rx="1.5" fill="#10b981">
        <animate attributeName="height" values="5;13;7;12;5" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="9;1;7;2;9" dur="1.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>

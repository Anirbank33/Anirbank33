<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 280" width="100%" height="280" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bkCmpBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#faf5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f3e8ff" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="bkCmpBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="bkCmpSheenLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bkCmpShimmerLight" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;220%" dur="7.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;320%" dur="7.4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="bkCmpOrbLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <circle cx="45" cy="50" r="40" fill="#c084fc" opacity="0.2" filter="url(#bkCmpOrbLight)">
    <animate attributeName="cx" values="45;70;45" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="190" r="45" fill="#a855f7" opacity="0.18" filter="url(#bkCmpOrbLight)">
    <animate attributeName="cy" values="190;160;190" dur="7s" repeatCount="indefinite"/>
  </circle>

  <rect x="2" y="2" width="166" height="276" rx="14" fill="url(#bkCmpBgLight)" stroke="url(#bkCmpBorderLight)" stroke-width="1.4"/>
  <rect x="2" y="2" width="166" height="276" rx="14" fill="url(#bkCmpSheenLight)"/>
  <rect x="2" y="2" width="166" height="276" rx="14" fill="url(#bkCmpShimmerLight)"/>
  <line x1="14" y1="2" x2="156" y2="2" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Category Tag -->
  <g transform="translate(10, 14)">
    <rect x="0" y="0" width="150" height="18" rx="5" fill="#f3e8ff" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="9" cy="9" r="3" fill="#7c3aed">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="12.5" fill="#6d28d9" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="0.5">
      SYSTEM ARCHITECTURE
    </text>
  </g>

  <!-- Title -->
  <text x="10" y="48" fill="#0f172a" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.2">
    backend-demo
  </text>
  <text x="10" y="62" fill="#7c3aed" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">
    Document REST API
  </text>

  <!-- Tagline -->
  <text x="10" y="78" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="500">
    Modular router &amp; client
  </text>

  <!-- ANIMATED PIPELINE HUD -->
  <g transform="translate(10, 88)">
    <rect x="0" y="0" width="150" height="78" rx="8" fill="#ffffff" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1"/>

    <line x1="0" y1="18" x2="150" y2="18" stroke="#f1f5f9" stroke-width="0.8"/>
    <text x="10" y="12" fill="#6d28d9" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">
      SERVICE ROUTER
    </text>
    <text x="142" y="12" text-anchor="end" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">
      200 OK
    </text>

    <line x1="38" y1="46" x2="62" y2="46" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="90" y1="46" x2="114" y2="46" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2,2"/>

    <g transform="translate(6, 34)">
      <rect x="0" y="0" width="32" height="24" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
      <text x="16" y="15" text-anchor="middle" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">CLI</text>
    </g>

    <g transform="translate(60, 34)">
      <rect x="0" y="0" width="32" height="24" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="16" y="15" text-anchor="middle" fill="#6d28d9" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">API</text>
    </g>

    <g transform="translate(112, 34)">
      <rect x="0" y="0" width="32" height="24" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="0.8"/>
      <text x="16" y="15" text-anchor="middle" fill="#047857" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">DB</text>
    </g>

    <circle cx="40" cy="46" r="2.5" fill="#0284c7">
      <animate attributeName="cx" values="40;60;40" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="92" cy="46" r="2.5" fill="#db2777">
      <animate attributeName="cx" values="92;112;92" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <text x="75" y="70" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600">
      GET /api/v1 • SECURE
    </text>
  </g>

  <!-- TECH BADGES -->
  <g transform="translate(10, 178)">
    <rect x="0" y="0" width="54" height="18" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="27" y="12.5" text-anchor="middle" fill="#6d28d9" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">Node.js</text>

    <rect x="60" y="0" width="46" height="18" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="83" y="12.5" text-anchor="middle" fill="#6d28d9" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">Express</text>

    <rect x="112" y="0" width="38" height="18" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="131" y="12.5" text-anchor="middle" fill="#6d28d9" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">REST</text>

    <rect x="0" y="24" width="50" height="18" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="25" y="36.5" text-anchor="middle" fill="#6d28d9" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">JWT Auth</text>

    <rect x="56" y="24" width="52" height="18" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="82" y="36.5" text-anchor="middle" fill="#6d28d9" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">Modular</text>

    <rect x="114" y="24" width="36" height="18" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="132" y="36.5" text-anchor="middle" fill="#6d28d9" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">CRUD</text>
  </g>

  <!-- Bottom CTA Pill -->
  <g transform="translate(10, 248)">
    <rect x="0" y="0" width="150" height="22" rx="11" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.1"/>
    <text x="75" y="15" text-anchor="middle" fill="#6d28d9" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.4">
      ⚡ INSPECT ENGINE ↗
    </text>
  </g>
</svg>